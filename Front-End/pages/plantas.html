<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="IncomeofHouses - Encontre o projeto perfeito para você">
    <link rel="stylesheet" href="../css/Tema/Tema.css">
    <link rel="stylesheet" href="../css/Plantas.css">
    <link rel="stylesheet" href="../css/Modais/LegalModal.css">
    <script src="../js/Preferencias.js"></script>
    <title>Plantas - Income of Houses</title>
</head>

<body>

    <header class="topo">
        <div class="logo">
            <a href="../index.html">
                <img src="../img/Logo.png" alt="Logo Income of Houses">
            </a>
        </div>

        <nav class="menu">
            <a href="../index.html">Início</a>
            <a href="../pages/Plantas.html" class="ativo">Plantas</a>
            <a href="../pages/Profissionais.html">Profissionais</a>
            <a href="../pages/Sobre.html">Sobre Nós</a>
        </nav>

        <div class="iconelogin">
            <a href="../pages/Login.html">
                <img src="../img/icones/IconePerfil.svg" alt="Entrar">
            </a>
        </div>
    </header>

    <main class="PaginaPlantas">

        <section class="HeroPlantas">
            <div class="HeroPlantasOverlay"></div>

            <div class="HeroPlantasConteudo">
                <span class="Etiqueta">Plantas</span>
                <h1>Encontre o projeto <br> perfeito para você</h1>
                <p>Explore nossa coleção de plantas arquitetônicas e filtre por suas preferências para encontrar o projeto ideal.</p>
            </div>
        </section>

        <section class="FiltrosCard">
            <div class="FiltrosGrid">

                <div class="Campo">
                    <label for="filtrotipo">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 11l9-8 9 8" /><path d="M5 10v10h14V10" /></svg>
                        Projetos
                    </label>
                    <select id="filtrotipo">
                        <option value="">Todos os projetos</option>
                        <optgroup label="Residencial">
                            <option>Casa Térrea</option>
                            <option>Sobrado</option>
                            <option>Casa Geminada</option>
                            <option>Casa de Condomínio</option>
                            <option>Casa de Campo</option>
                            <option>Casa de Praia</option>
                            <option>Chácara</option>
                            <option>Sítio</option>
                            <option>Fazenda</option>
                        </optgroup>

                        <optgroup label="Apartamentos">
                            <option>Apartamento</option>
                            <option>Kitnet / Studio</option>
                            <option>Loft</option>
                            <option>Cobertura</option>
                        </optgroup>

                        <optgroup label="Construções Especiais">
                            <option>Edícula</option>
                            <option>Casa de Madeira</option>
                            <option>Casa Pré-Fabricada</option>
                            <option>Casa Modular</option>
                        </optgroup>

                        <optgroup label="Comercial">
                            <option>Loja</option>
                            <option>Sala Comercial</option>
                            <option>Escritório</option>
                            <option>Galpão</option>
                            <option>Prédio Comercial</option>
                        </optgroup>

                        <optgroup label="Industrial">
                            <option>Galpão Industrial</option>
                            <option>Fábrica</option>
                            <option>Centro de Distribuição</option>
                        </optgroup>

                        <optgroup label="Lazer">
                            <option>Área de Lazer</option>
                            <option>Espaço Gourmet</option>
                            <option>Salão de Festas</option>
                            <option>Área de Piscina</option>
                        </optgroup>

                        <optgroup label="Projetos">
                            <option>Projeto Residencial</option>
                            <option>Projeto Comercial</option>
                            <option>Projeto Industrial</option>
                            <option>Projeto Arquitetônico</option>
                        </optgroup>
                    </select>
                </div>

                <div class="Campo">
                    <label for="filtroquartos">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 18v-6a3 3 0 013-3h12a3 3 0 013 3v6" /><path d="M3 18h18" /><path d="M7 12V9a2 2 0 012-2h6a2 2 0 012 2v3" /></svg>
                        Quartos
                    </label>
                    <select id="filtroquartos">
                        <option value="">Todos</option>
                        <option value="1">1 quarto</option>
                        <option value="2">2 quartos</option>
                        <option value="3">3 quartos</option>
                        <option value="4">4 quartos</option>
                        <option value="5+">5+ quartos</option>
                    </select>
                </div>

                <div class="Campo">
                    <label for="filtrogaragem">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 17h14M5 17a2 2 0 01-2-2v-2l2-5h14l2 5v2a2 2 0 01-2 2M5 17v2a1 1 0 001 1h1a1 1 0 001-1v-2m10 0v2a1 1 0 001 1h1a1 1 0 001-1v-2" /><circle cx="7.5" cy="14.5" r="1" /><circle cx="16.5" cy="14.5" r="1" /></svg>
                        Garagens
                    </label>
                    <select id="filtrogaragem">
                        <option value="">Todas</option>
                        <option value="0">Sem garagem</option>
                        <option value="1">1 vaga</option>
                        <option value="2">2 vagas</option>
                        <option value="3">3 vagas</option>
                        <option value="4+">4+ vagas</option>
                    </select>
                </div>

                <div class="Campo">
                    <label for="filtroarea">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 20L20 4M4 20h6M4 20v-6M20 4h-6M20 4v6" /></svg>
                        Área construída
                    </label>
                    <select id="filtroarea">
                        <option value="">Todas as áreas</option>
                        <option value="0-60">Até 60 m²</option>
                        <option value="60-100">60 a 100 m²</option>
                        <option value="100-150">100 a 150 m²</option>
                        <option value="150-200">150 a 200 m²</option>
                        <option value="200-300">200 a 300 m²</option>
                        <option value="300-500">300 a 500 m²</option>
                        <option value="500-">Acima de 500 m²</option>
                    </select>
                </div>

                <div class="Campo">
                    <label for="filtroestilo">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9" /><circle cx="9" cy="9" r="1" /><circle cx="15" cy="9" r="1" /><circle cx="9" cy="15" r="1" /><path d="M12 12a3 3 0 003 3h1a2 2 0 000-4 2 2 0 01-2-2 3 3 0 00-2-2" /></svg>
                        Estilo
                    </label>
                    <select id="filtroestilo">
                        <option value="">Todos os estilos</option>
                        <option value="Moderno">Moderno</option>
                        <option value="Contemporâneo">Contemporâneo</option>
                        <option value="Minimalista">Minimalista</option>
                        <option value="Clássico">Clássico</option>
                        <option value="Neoclássico">Neoclássico</option>
                        <option value="Colonial">Colonial</option>
                        <option value="Rústico">Rústico</option>
                        <option value="Industrial">Industrial</option>
                        <option value="Escandinavo">Escandinavo</option>
                        <option value="Tropical">Tropical</option>
                    </select>
                </div>

                <button id="btnPesquisar" class="BtnPesquisar">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7" /><path d="M21 21l-4-4" /></svg>
                    Pesquisar
                </button>

            </div>
        </section>

        <p id="mensagemPlantas" role="status" aria-live="polite"></p>

        <div id="ListaPlantas"></div>

        <div id="paginacao"></div>

    </main>

    <footer class="rodape">
        <p>©IncomeOfHouses. Todos os direitos reservados.</p>
        <div class="RodapeLinks">
            <a href="../pages/Modais/TermosUso.html" data-legal="termos">Termos de Uso</a>
            <span>|</span>
            <a href="../pages/Modais/PoliticaPrivacidade.html" data-legal="privacidade">Política de Privacidade</a>
        </div>
    </footer>

    <script src="../js/Modais/LegalModais.js"></script>
    <script src="../js/PlantasStorage.js"></script>
    <script src="../js/Favoritos.js"></script>
    <script src="../js/plantas.js"></script>
    <script src="../js/Idioma.js"></script>
</body>
</html>
