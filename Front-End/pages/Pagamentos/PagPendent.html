<!DOCTYPE html>
<html lang="pt-br">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <meta name="description" content="IncomeofHouses - Site de renda passiva com imóveis">
   <link rel="stylesheet" href="../../css/Tema/Tema.css">
   <link rel="stylesheet" href="../../css/Pagamentos/PagStatus.css">
   <script src="../../js/Preferencias.js"></script>
   <title>Pagamento Pendente</title>
</head>

<body data-conta="usuario">
   <header class="topo">
      <div class="logo">
         <a href="../index.html">
            <img src="../../img/Logo.png" alt="Logo Income of Houses">
         </a>
      </div>
      <nav class="menu">
         <a href="../../index.html">Início</a>
         <a href=".././plantas.html">Plantas</a>
         <a href=".././Profissionais.html">Profissionais</a>
         <a href=".././sobre.html">Sobre Nós</a>
      </nav>
   </header>

   <main class="BackGround">
      <section class="CardStatus status-pendente">

         <div class="SeloStatus">
            <span class="linha"></span>
            <div class="CirculoStatus">
               <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 6.5V12l3.8 2.6"></path>
               </svg>
            </div>
            <span class="linha"></span>
         </div>

         <h1>Pagamento <span>Pendente</span></h1>
         <p class="MensagemStatus">
            Seu pagamento ainda está sendo processado.<br>
            Isso pode levar alguns minutos.
         </p>

         <div class="AvisoStatus" role="status">
            <svg viewBox="0 0 24 24" aria-hidden="true">
               <circle cx="12" cy="12" r="9.5"></circle>
               <path d="M12 11v6M12 7.5v.5"></path>
            </svg>
            <p>Não feche esta página até que o pagamento seja confirmado.</p>
         </div>

         <div class="DetalhesPedido">
            <svg class="IconeDetalhes" viewBox="0 0 24 24" aria-hidden="true">
               <path d="M6 3h9l4 4v14H6z"></path>
               <path d="M14.5 3v4.5H19"></path>
               <path d="M9 11.5h7M9 15h7M9 18.5h4"></path>
            </svg>
            <div class="DetalhesConteudo">
               <h3>Detalhes do Pedido</h3>
               <div class="DetalhesLinha">
                  <span id="numeroPedido">Pedido #INH-20261112-0042</span>
                  <strong id="valorPedido">R$ 89,90</strong>
               </div>
            </div>
         </div>

         <button type="button" class="BotaoPrincipal" id="btnVerificar">
            <svg viewBox="0 0 24 24" aria-hidden="true">
               <path d="M20 11a8 8 0 0 0-14.3-4.5L4 8.5"></path>
               <path d="M4 4v4.5h4.5"></path>
               <path d="M4 13a8 8 0 0 0 14.3 4.5L20 15.5"></path>
               <path d="M20 20v-4.5h-4.5"></path>
            </svg>
            <span>Verificar Status do Pagamento</span>
         </button>

         <a href="../../index.html" class="LinkVoltar">
            <svg viewBox="0 0 24 24" aria-hidden="true">
               <path d="M20 12H4M10 6l-6 6 6 6"></path>
            </svg>
            Voltar para o Início
         </a>
      </section>
   </main>

   <script src="../../js/Conta.js"></script>
   <script src="../../js/PagamentoPendente.js"></script>
   <script src="../../js/Idioma.js"></script>
</body>

</html>
