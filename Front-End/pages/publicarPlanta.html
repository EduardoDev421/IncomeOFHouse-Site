<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="IncomeofHouses - Quem somos">
    <link rel="stylesheet" href="../css/publicarPlanta.css">
    <title>Publicar Planta - Income of Houses</title>
</head>

<body>
    <header class="topo">
        <div class="logo">
            <a href="../index.html">
                <img src="../img/Logo.png" alt="Logo Income of Houses">
            </a>
        </div>
        <nav class="menu">
            <a href="../index.html">Início</a>
            <a href="./Plantas.html">Plantas</a>
            <a href="./Profissionais.html">Profissionais</a>
            <a href="./Sobre.html">Sobre Nós</a>
        </nav>
        <div class="iconelogin">
            <a href="./Login.html">
                <img src="../img/icones/IconePerfil.svg" alt="iconeLogin" href="../Front-End/pages/Login.html"
                    class="iconelogin">
            </a>
        </div>
    </header>
    <main class="BackGround">
        <section class="PublicarPlanta">
            <h1>Publicar Nova Planta</h1>
            <p> Preencha as informações abaixo para cadastrar uma nova planta.</p>

            <form class="formPublicarPlanta" id="formPublicarPlanta">

                <div class="campo">
                    <label for="titulo">Título da Planta</label>
                    <input type="text" id="titulo" placeholder="Ex.: Casa Moderna com 3 Quartos" required>
                </div>

                <div class="campo">
                    <label for="descricao">Descrição</label>
                    <textarea id="descricao" rows="6" placeholder="Descreva sua planta..." required></textarea>
                </div>

                <div class="campo">
                    <label for="estilo">Estilo da Planta</label>
                    <select id="estilo" name="estilo">
                        <option value="">Selecione</option>
                        <option value="Moderno">Moderno</option>
                        <option value="Contemporâneo">Contemporâneo</option>
                        <option value="Clássico">Clássico</option>
                        <option value="Rústico">Rústico</option>
                        <option value="Minimalista">Minimalista</option>
                        <option value="Colonial">Colonial</option>
                    </select>
                </div>

                <!-- Distribuição dos ambientes -->
                <div class="campo full">
                    <label for="distribuicaoAmbientes">Distribuição dos Ambientes</label>
                    <textarea id="distribuicaoAmbientes" name="distribuicaoAmbientes" rows="3"
                        placeholder="Ex.: Sala integrada com cozinha, suíte master com closet, área gourmet..."></textarea>
                </div>

                <!-- Destaques do projeto -->
                <fieldset class="destaques-box full">
                    <legend>Destaques do Projeto</legend>

                    <div class="destaques-lista" id="listaDestaques"></div>

                    <div class="destaques-adicionar">
                        <input type="text" id="destaquesPersonalizados" placeholder="Digite um diferencial e pressione Enter (ex.: Energia solar)">
                        <button type="button" id="botaoAdicionarDestaque">Adicionar</button>
                    </div>
                </fieldset>

                <div class="campo">
                    <label for="categoria">Categoria</label>
                    <select id="categoria" required>
                        <option value="">Selecione</option>
                        <optgroup label="Residencial">
                            <option>Casa Térrea</option>
                            <option>Sobrado</option>
                            <option>Casa Geminada</option>
                            <option>Casa de Condomínio</option>
                            <option>Casa de Campo</option>
                            <option>Casa de Praia</option>
                            <option>Chácara</option>
                            <option>Sítio</option>
                            <option>Fazenda</option>
                        </optgroup>

                        <optgroup label="Apartamentos">
                            <option>Apartamento</option>
                            <option>Kitnet / Studio</option>
                            <option>Loft</option>
                            <option>Cobertura</option>
                        </optgroup>

                        <optgroup label="Construções Especiais">
                            <option>Edícula</option>
                            <option>Casa de Madeira</option>
                            <option>Casa Pré-Fabricada</option>
                            <option>Casa Modular</option>
                        </optgroup>

                        <optgroup label="Comercial">
                            <option>Loja</option>
                            <option>Sala Comercial</option>
                            <option>Escritório</option>
                            <option>Galpão</option>
                            <option>Prédio Comercial</option>
                        </optgroup>

                        <optgroup label="Industrial">
                            <option>Galpão Industrial</option>
                            <option>Fábrica</option>
                            <option>Centro de Distribuição</option>
                        </optgroup>

                        <optgroup label="Lazer">
                            <option>Área de Lazer</option>
                            <option>Espaço Gourmet</option>
                            <option>Salão de Festas</option>
                            <option>Área de Piscina</option>
                        </optgroup>

                        <optgroup label="Projetos">
                            <option>Projeto Residencial</option>
                            <option>Projeto Comercial</option>
                            <option>Projeto Industrial</option>
                            <option>Projeto Arquitetônico</option>
                        </optgroup>
                    </select>
                </div>

                <div class="campo">
                    <label for="quartos">Quantidade de Quartos</label>
                    <input type="number" id="quartos" min="1" required placeholder="Ex.: 3 quartos">
                </div>

                <div class="campo">
                    <label for="banheiros">Quantidade de Banheiros</label>
                    <input type="number" id="banheiros" min="1" required placeholder="Ex.: 2 banheiros">
                </div>

                <div class="campo">
                    <label for="garagem">Vagas na Garagem</label>
                    <input type="number" id="garagem" min="0" required placeholder="Ex.: 2 vagas">
                </div>

                <div class="campo">
                    <label for="area">Área Construída (m²)</label>
                    <input type="number" id="area" min="0" required placeholder="Ex.: 120 m²">
                </div>

                <div class="campo">
                    <label for="preco">Preço (R$)</label>
                    <input type="number" id="preco" min="0" step="0.01" required placeholder="Ex.: R$ 350.000,00">
                </div>

                <div class="campo">
                    <label for="imagem">Imagem da Planta</label>
                    <input type="file" id="imagem" accept="image/*" required>
                </div>

                <button id="botaoPublicar" type="submit">
                    Publicar Planta
                </button>
            </form>
        </section>
    </main>

    <footer class="rodape">
        <p>©IncomeOfHouses. Todos os direitos reservados.</p>
        <div class="RodapeLinks">
            <a href="../pages/TermosUso.html">Termos de Uso</a>
            <span>|</span>
            <a href="../pages/PoliticaPrivacidade.html">Política de Privacidade</a>
        </div>
    </footer>

    <script src="../js/PlantasStorage.js"></script>
    <script src="../js/publicarPlanta.js"></script>
</body>

</html>
